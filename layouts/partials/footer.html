<footer class="article-footer">
    <div class="footer-links">
        <a href="{{ .Site.Home.RelPermalink }}">Home</a>
        {{ with .Site.Params.github }}
        <span class="separator">·</span>
        <a href="{{ . }}" target="_blank" rel="noopener">GitHub</a>
        {{ end }}
        {{ with .Site.Params.email }}
        <span class="separator">·</span>
        <a href="mailto:{{ . }}">Mail</a>
        {{ end }}
        {{ with .Site.Home.OutputFormats.Get "RSS" }}
        <span class="separator">·</span>
        <a href="{{ .RelPermalink }}" target="_blank" rel="noopener">RSS</a>
        {{ else }}{{ with .Site.Params.rss }}
        <span class="separator">·</span>
        <a href="{{ . | relURL }}" target="_blank" rel="noopener">RSS</a>
        {{ end }}{{ end }}
        <span class="separator">·</span>
        <a href="#" class="back-to-top" aria-label="Back to top">Back to top</a>
    </div>
    <div class="copyright">&copy; {{ now.Format "2006" }} {{ .Site.Title }}</div>
</footer>
