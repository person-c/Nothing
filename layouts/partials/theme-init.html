{{- /* Theme bootstrap: runs before first paint to apply the stored color
       preference and to expose __cycleTheme. Kept inline (not a deferred file)
       so it prevents a flash of the wrong theme. */ -}}
    <script>
        (function() {
            // Lets CSS hide JS-only controls before/without scripts.
            document.documentElement.classList.add('js');
            var root = document.documentElement;

            // localStorage can throw (disabled cookies / private modes); never
            // let that break the theme or the rest of the page scripts.
            window.__storage = {
                get: function(key) { try { return localStorage.getItem(key); } catch (e) { return null; } },
                set: function(key, value) { try { localStorage.setItem(key, value); } catch (e) {} }
            };
            var media = window.matchMedia('(prefers-color-scheme: dark)');

            function storedTheme() {
                var t = null;
                t = window.__storage.get('theme');
                return (t === 'dark' || t === 'light') ? t : 'auto';
            }

            function applyTheme(pref) {
                root.classList.remove('dark', 'light');
                if (pref === 'dark') {
                    root.classList.add('dark');
                } else if (pref === 'light') {
                    root.classList.add('light');
                } else if (media.matches) {
                    root.classList.add('dark');
                }
            }

            function persistTheme(pref) {
                window.__storage.set('theme', pref);
            }

            // Initial paint for the stored preference (auto follows the system).
            applyTheme(storedTheme());

            // Cycle dark -> light -> auto. "auto" must re-evaluate the system
            // preference instead of just dropping both classes.
            window.__cycleTheme = function() {
                var current = root.classList.contains('dark') ? 'dark' : (root.classList.contains('light') ? 'light' : 'auto');
                var next = current === 'dark' ? 'light' : (current === 'light' ? 'auto' : 'dark');
                applyTheme(next);
                persistTheme(next);
                return next;
            };

            // Keep auto mode in sync when the OS scheme changes.
            function onSchemeChange() {
                if (storedTheme() === 'auto') applyTheme('auto');
            }

            if (media.addEventListener) {
                media.addEventListener('change', onSchemeChange);
            } else if (media.addListener) {
                media.addListener(onSchemeChange);
            }

            // Sun/moon icons are rendered server-side and switched by CSS, so
            // no icon strings (and no first-paint icon flash) are needed here.
        })();
    </script>
