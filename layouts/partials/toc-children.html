{{- /* Nested children of the table of contents. */ -}}
<ul class="toc-sublist">
    {{- range . -}}
    {{- if ge .Level 2 -}}
    <li class="toc-level-{{ .Level }}{{ if .Headings }} collapsible{{ end }}">
        {{- if .Headings }}
        <button type="button" class="toc-toggle" aria-expanded="false" aria-label="Toggle section">{{ partial "icons/chevron-right.html" (dict "size" 12) }}</button>
        {{- end }}
        <a href="#{{ .ID }}">{{ .Title }}</a>
        {{- if .Headings }}
        {{ partial "toc-children.html" .Headings }}
        {{- end }}
    </li>
    {{- end -}}
    {{- end -}}
</ul>
