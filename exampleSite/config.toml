baseURL = "http://localhost:1313/"
languageCode = "en-us"
title = "Nightingale"
theme = "Nothing"

ignoreFiles = ["\\.Rmd$"]

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.goldmark.extensions]
      footnote = true
  [markup.highlight]
    noClasses = false       # 使用 CSS 类名；亮/暗两套语法配色见 assets/css/syntax-*.css
    style = "github"        # 亮色语法主题（暗色由 syntax-dark.css 覆盖；noClasses=false 时不参与构建）
    lineNos = true          # 显示行号（Hugo 的键名是 lineNos，不是 lineNumbers）
    lineNumbersInTable = false # 行号内联输出，避免行号表格被 article table 样式污染
    guessSyntax = true      # 自动猜测代码语言

[server]
watch = true

enableGitInfo = true

[outputs]
  home = ["HTML", "RSS", "JSON"]

[menu]
  [[menu.main]]
    name = "Home"
    url = "/"
    weight = 1
  [[menu.main]]
    name = "About"
    url = "/about/"
    weight = 2
  [[menu.main]]
    name = "Blog"
    url = "/blog/"
    weight = 3
  [[menu.main]]
    name = "Note"
    url = "/note/"
    weight = 4
  [[menu.main]]
    name = "Slides"
    url = "/slides/"
    weight = 5
  [[menu.main]]
    name = "Books"
    url = "/books/"
    weight = 6
  [[menu.main]]
    name = "Search"
    url = "/search/"
    weight = 7

paginate = 10

[params]
  github = "https://github.com/person-c/myBlog"
  email = "m2c.w@outlook.com"
  rss = "/index.xml"